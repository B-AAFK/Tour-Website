# =============================================================================
# Cape Private Tours — Hardened Production Nginx Configuration
# =============================================================================

server_tokens off;
limit_req_status 429;
limit_conn_status 429;

# Rate limiting & connection cap zones (evaluated inside http {} context)
limit_req_zone $binary_remote_addr zone=html_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=frames_limit:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=addr_conn:10m;

# Block aggressive automated scraping/scanning user-agents while permitting browsers,
# search crawlers, Lighthouse, and wget/curl health checks.
map $http_user_agent $is_blocked_scraper {
    default 0;
    ~*(HTTrack|WebCopier|Offline\ Explorer|SiteSnagger|Teleport|Scrapy|sqlmap|nikto|dirbuster|masscan|zgrab|Nmap) 1;
}

server {
    listen 8080;
    # IMPORTANT: Set server_name to your production domain (e.g. capeprivatetours.co.za)
    # before launch so valid_referers hotlink protection matches production traffic.
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;

    if ($is_blocked_scraper) {
        return 403;
    }

    # Gzip compression for text assets & SVG (skip already-compressed .webp/.jpg)
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;

    # Security headers (always flag ensures 403/404/429 responses remain hardened)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # Enable once served behind HTTPS/TLS termination:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # HTML documents: throttled + never cached
    location = / {
        limit_req zone=html_limit burst=20 nodelay;
        limit_conn addr_conn 20;
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    location ~* \.html$ {
        limit_req zone=html_limit burst=20 nodelay;
        limit_conn addr_conn 20;
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # Future Phase-2 API gateway rate-limit placeholder
    location /api/ {
        limit_req zone=html_limit burst=10 nodelay;
        limit_conn addr_conn 10;
        return 404;
    }

    # 450 WebP sequence frames: generous burst so concurrency-6 preloader never hits 429,
    # plus hotlink guard. Update server_name above to your production domain before launch.
    location ~* ^/frames/.*\.webp$ {
        limit_req zone=frames_limit burst=460 nodelay;
        limit_conn addr_conn 20;
        valid_referers none blocked server_names localhost 127.0.0.1;
        if ($invalid_referer) {
            return 403;
        }
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # Static photography with hotlink guard (update server_name above before launch)
    location ~* ^/images/.*\.(webp|jpe?g|png|svg)$ {
        valid_referers none blocked server_names localhost 127.0.0.1;
        if ($invalid_referer) {
            return 403;
        }
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # Content-hashed Vite assets
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # Remaining local files (e.g. robots.txt)
    location / {
        try_files $uri $uri/ =404;
    }
}
