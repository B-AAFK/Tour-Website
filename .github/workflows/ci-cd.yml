name: CI/CD

on:
  push:
    branches:
      - '**'
    paths:
      - 'index.html'
      - 'booking.html'
      - '404.html'
      - 'src/**'
      - 'public/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'Dockerfile'
      - 'nginx.conf'
      - '.dockerignore'
      - 'docker-compose.yml'
      - '.github/workflows/**'
  pull_request:
    branches:
      - '**'
    paths:
      - 'index.html'
      - 'booking.html'
      - '404.html'
      - 'src/**'
      - 'public/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'Dockerfile'
      - 'nginx.conf'
      - '.dockerignore'
      - 'docker-compose.yml'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test & Build Vite Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Shallow checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js 22 with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run automated test suite
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Verify multi-page dist output
        run: |
          test -f dist/index.html
          test -f dist/booking.html
          test -f dist/404.html

  docker-verify:
    name: Build & Smoke-Test Docker Image
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Shallow checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image with GHA layer cache
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: cape-private-tours:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container and verify HTTP 200 endpoints
        run: |
          docker run -d --name tour-ci-smoke -p 8080:8080 cape-private-tours:ci
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then
              break
            fi
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/booking.html)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/frames/com-part-1/ezgif-frame-001.webp)" = "200"

      - name: Clean up smoke container
        if: always()
        run: docker rm -f tour-ci-smoke

  docker-publish:
    name: Publish Image to GHCR
    needs: docker-verify
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Shallow checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
